[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plt"
version = "0.1.0"
description = "Pesticide Litigation Tracker - Flask API, SQLAlchemy models and ingestion pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wageningen University & Research, Law group" }]
keywords = ["case-law", "pesticides", "litigation", "flask", "open-data"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
    "Typing :: Typed",
]
dependencies = [
    "flask>=3.0,<4.0",
    "flask-cors>=4.0,<7.0",
    "flask-limiter>=3.5,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.21,<5.0",
    "lxml>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-flask-cors>=4.0",
    "types-jsonschema>=4.21",
    "lxml-stubs>=0.5",
    # Windows ships no timezone database; alembic needs one to stamp a new revision.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/IdseVal/PLT"

[project.scripts]
plt = "plt.cli:main"

[tool.setuptools.packages.find]
include = ["plt*"]

[tool.setuptools.package-data]
plt = ["py.typed"]

# --------------------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez (timezone-aware UTC is a schema contract)
    "T20", # flake8-print (use the logger, never print)
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
    "S",   # flake8-bandit (security)
    "D",   # pydocstyle (docstrings are mandatory)
    "ANN", # flake8-annotations (full type annotations are mandatory)
]
ignore = [
    "D203", # incompatible with D211 (no blank line before class docstring)
    "D213", # incompatible with D212 (multi-line summary on the first line)
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; per-test docstrings stay optional whether the test is a
# function (D103) or a method of a grouping class (D102) - the class itself is still
# documented; S105/S106 fire on throwaway literals that exist precisely to prove production
# rejects real ones.
"tests/**" = ["S101", "S105", "S106", "D102", "D103"]
"migrations/env.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

# --------------------------------------------------------------------------------------
# Mypy
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_generics = true
show_error_codes = true
pretty = true
files = ["plt", "tests", "migrations"]
exclude = "migrations/versions/"

[[tool.mypy.overrides]]
module = ["flask_limiter.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: hits a live external endpoint; opt in with -m integration",
]
filterwarnings = ["error::DeprecationWarning:plt.*"]

[tool.coverage.run]
source = ["plt"]
branch = true
