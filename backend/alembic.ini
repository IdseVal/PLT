; Alembic configuration.
;
; The database URL is deliberately absent: migrations/env.py reads it from
; plt.config.Settings (PLT_DATABASE_URL), so no credential is ever written to a file in the
; repository. Run migrations from the backend/ directory:
;
;   alembic revision --autogenerate -m "add case table"
;   alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff
# "module", not "console_scripts": ruff is a standalone binary that registers no entry point,
# so console_scripts fails the hook outright. "module" runs it through the interpreter alembic
# itself is running under, which finds it in the active virtualenv on Windows and Linux alike.
ruff.type = module
ruff.module = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
